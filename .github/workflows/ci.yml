name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: game_player_service_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run component tests
        run: python -m pytest -m "not integration" -q

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: game_player_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d game_player_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: game_player_service_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run integration tests
        run: python -m pytest -m integration -q
